<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#4ec0ca" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Wingy Hills" />
  <title>Wingy Hills</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-container">
    <canvas id="game"></canvas>

    <!-- Score + multiplier shown during play -->
    <div id="hud">
      <div id="score">0</div>
      <div id="mult">x1</div>
    </div>

    <!-- Pause button (visible only while playing) -->
    <button id="pause-btn" class="hidden" aria-label="Pause">❚❚</button>

    <!-- Pause screen -->
    <div id="pause-screen" class="overlay hidden">
      <h2>Paused</h2>
      <button id="resume-btn" class="btn">Resume</button>
    </div>

    <!-- Start screen -->
    <div id="start-screen" class="overlay">
      <h1>Wingy Hills</h1>
      <p class="subtitle">Hold to dive, release to glide</p>
      <p class="hint">Dive down the slopes to build speed,<br />then soar off the hilltops.</p>
      <button id="start-btn" class="btn">Play</button>
      <div class="best-line">Best: <span id="start-best">0</span></div>
    </div>

    <!-- Game over screen -->
    <div id="gameover-screen" class="overlay hidden">
      <h2>Night Fell</h2>
      <div class="result-card">
        <div class="result-row"><span>Distance</span><span id="final-dist">0 m</span></div>
        <div class="result-row"><span>Score</span><span id="final-score">0</span></div>
        <div class="result-row"><span>Best</span><span id="best-score">0</span></div>
      </div>
      <div id="new-best" class="new-best hidden">New Best!</div>
      <button id="restart-btn" class="btn">Play Again</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
